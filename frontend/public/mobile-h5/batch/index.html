<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>批量查询</title>
  <link rel="stylesheet" href="../assets/fixed-layout.css" />
  <link rel="stylesheet" href="../assets/batch-page.css?v=4" />
  <link rel="stylesheet" href="../assets/bottom-nav.css" />
</head>
<body>
  <div class="batch-page">
    <h1 class="batch-title">批量查询</h1>
    <div class="batch-card">
      <textarea
        id="phones"
        class="batch-textarea"
        placeholder="请输入手机号码，每行一个&#10;例如：&#10;13800138000&#10;13900139000"
      ></textarea>
      <div class="batch-toolbar">
        <p class="batch-count" id="count">已输入 0 个号码</p>
        <div class="batch-sub-btns">
          <button type="button" class="batch-sub-btn" id="btn-extract">号码提取</button>
          <button type="button" class="batch-sub-btn" id="btn-paste">粘贴号码</button>
          <button type="button" class="batch-sub-btn" id="btn-clear">清空列表</button>
        </div>
      </div>
      <button type="button" class="batch-btn" id="submit">开始批量查询</button>
    </div>
    <div class="batch-result" id="results"></div>
  </div>

  <div id="batch-detail-modal" class="batch-detail-modal" hidden>
    <div class="batch-detail-mask" id="batch-detail-mask"></div>
    <div class="batch-detail-panel" role="dialog" aria-modal="true" aria-label="号码详情">
      <div class="batch-detail-header">
        <h3 class="batch-detail-phone" id="batch-detail-phone">--</h3>
        <button type="button" class="batch-detail-close" id="batch-detail-close" aria-label="关闭">×</button>
      </div>
      <div class="batch-detail-list" id="batch-detail-list"></div>
    </div>
  </div>

  <script src="../assets/api-bridge.js"></script>
  <script src="../assets/query-stats.js"></script>
  <script src="../assets/bottom-nav.js"></script>
  <script src="../assets/batch-page.js?v=4"></script>
</body>
</html>
