<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>个人中心</title>
  <link rel="stylesheet" href="../assets/fixed-layout.css" />
  <link rel="stylesheet" href="../assets/profile-page.css" />
  <link rel="stylesheet" href="../assets/bottom-nav.css" />
</head>
<body>
  <div class="profile-page">
    <header class="profile-hero">
      <button type="button" class="profile-user" id="profile-user-btn">
        <div class="profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 19.5c1.2-3 3.4-4.5 6.5-4.5s5.3 1.5 6.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <div class="profile-user-text">
          <p class="profile-login-title" id="profile-title">登录/注册</p>
          <p class="profile-login-desc" id="profile-desc">取消号码标记，提升号码接听效率~</p>
        </div>
        <span class="profile-user-arrow" aria-hidden="true">›</span>
      </button>
    </header>

    <div class="profile-stats-card">
      <button type="button" class="profile-stat" id="stat-points">
        <span class="profile-stat-num" id="profile-points-value">--</span>
        <span class="profile-stat-label">当前积分</span>
      </button>
      <span class="profile-stat-divider" aria-hidden="true"></span>
      <button type="button" class="profile-stat" id="stat-today-query">
        <span class="profile-stat-num" id="profile-today-query-value">--</span>
        <span class="profile-stat-label">今日查询</span>
      </button>
      <span class="profile-stat-divider" aria-hidden="true"></span>
      <button type="button" class="profile-stat" id="stat-recharge">
        <span class="profile-stat-num profile-stat-action" id="profile-recharge-text">登录</span>
        <span class="profile-stat-label" id="profile-recharge-label">立即登录</span>
      </button>
    </div>

    <div class="profile-body">
      <div class="profile-card">
        <button type="button" class="profile-row" id="btn-batch">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 9h8M8 12h8M8 15h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">批量查询</span>
          <span class="profile-row-arrow">›</span>
        </button>
        <button type="button" class="profile-row" id="btn-query-records">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">查询记录</span>
          <span class="profile-row-arrow">›</span>
        </button>
        <button type="button" class="profile-row" id="btn-recharge-records">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M7 15h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">充值记录</span>
          <span class="profile-row-arrow">›</span>
        </button>
        <button type="button" class="profile-row" id="btn-change-password">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">修改密码</span>
          <span class="profile-row-arrow">›</span>
        </button>
      </div>

      <div class="profile-card">
        <button type="button" class="profile-row" id="btn-service">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.6"/><path d="M6 20c.8-3 2.8-4.5 6-4.5s5.2 1.5 6 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">在线客服</span>
          <span class="profile-row-arrow">›</span>
        </button>
        <button type="button" class="profile-row" id="btn-invite">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </span>
          <span class="profile-row-label">邀请好友</span>
          <span class="profile-row-arrow">›</span>
        </button>
        <a class="profile-row" href="about.html">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">关于我们</span>
          <span class="profile-row-arrow">›</span>
        </a>
      </div>

      <div class="profile-card">
        <a class="profile-row" href="agreement.html">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 4h8l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 4v4h4M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="profile-row-label">用户协议</span>
          <span class="profile-row-arrow">›</span>
        </a>
        <a class="profile-row" href="privacy.html">
          <span class="profile-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 12.5l1.8 1.8 3.7-3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="profile-row-label">隐私协议</span>
          <span class="profile-row-arrow">›</span>
        </a>
      </div>
    </div>
  </div>

  <div id="profile-login-modal" class="profile-login-modal" hidden>
    <div class="profile-login-mask" id="profile-login-mask"></div>
    <div class="profile-login-wrap">
      <div class="profile-login-panel" role="dialog" aria-label="账号登录">
        <h2>账号登录</h2>
        <div class="profile-field">
          <input id="profile-account" type="text" maxlength="32" placeholder="请输入账号" autocomplete="username" />
        </div>
        <div class="profile-field">
          <input id="profile-password" type="password" maxlength="32" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <p class="profile-login-tip">账户由客服开通，忘记密码请联系客服</p>
        <button type="button" class="profile-submit-btn" id="profile-login-submit">登录</button>
        <button type="button" class="profile-close-btn" id="profile-login-close">取消</button>
      </div>
    </div>
  </div>

  <div id="profile-password-modal" class="profile-login-modal" hidden>
    <div class="profile-login-mask" id="profile-password-mask"></div>
    <div class="profile-login-wrap">
      <div class="profile-login-panel" role="dialog" aria-label="修改密码">
        <h2>修改密码</h2>
        <div class="profile-field">
          <input id="profile-old-password" type="password" maxlength="32" placeholder="请输入原密码" autocomplete="current-password" />
        </div>
        <div class="profile-field">
          <input id="profile-new-password" type="password" maxlength="32" placeholder="请输入新密码（至少6位）" autocomplete="new-password" />
        </div>
        <div class="profile-field">
          <input id="profile-confirm-password" type="password" maxlength="32" placeholder="请再次输入新密码" autocomplete="new-password" />
        </div>
        <button type="button" class="profile-submit-btn" id="profile-password-submit">确认修改</button>
        <button type="button" class="profile-close-btn" id="profile-password-close">取消</button>
      </div>
    </div>
  </div>

  <script src="../assets/runtime-config.js"></script>
  <script src="../assets/bottom-nav.js"></script>
  <script src="../assets/query-stats.js"></script>
  <script src="../assets/api-bridge.js"></script>
  <script src="../assets/query-records.js?v=1"></script>
  <script src="../assets/profile-page.js?v=2"></script>
</body>
</html>
