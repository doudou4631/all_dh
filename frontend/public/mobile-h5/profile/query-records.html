<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>查询记录</title>
  <link rel="stylesheet" href="../assets/fixed-layout.css" />
  <link rel="stylesheet" href="../assets/profile-page.css" />
  <link rel="stylesheet" href="../assets/bottom-nav.css" />
</head>
<body>
  <div class="profile-sub-page">
    <a class="profile-sub-back" href="index.html">‹ 返回个人中心</a>
    <h1 class="profile-sub-title">查询记录</h1>
    <div id="record-list" class="profile-record-list"></div>
  </div>

  <script src="../assets/bottom-nav.js"></script>
  <script src="../assets/profile-page.js"></script>
  <script>
    if (!window.ProfilePage || !ProfilePage.isLoggedIn()) {
      if (window.AppBottomNav && typeof window.AppBottomNav.notify === 'function') {
        window.AppBottomNav.notify('请先登录');
      }
      setTimeout(function () {
        location.replace('index.html');
      }, 400);
    } else {
      var list = ProfilePage.getQueryRecords();
      var el = document.getElementById('record-list');
      if (!list.length) {
        el.innerHTML = '<div class="profile-sub-empty">暂无查询记录</div>';
      } else {
        el.innerHTML = list
          .map(function (item) {
            return (
              '<div class="profile-record-item">' +
              '<div class="profile-record-head"><strong>' + item.phone + '</strong><span>' + item.time + '</span></div>' +
              '<div class="profile-record-meta">类型：' + item.type + ' · 标记平台：' + item.marked + ' 个</div>' +
              '</div>'
            );
          })
          .join('');
      }
    }
  </script>
</body>
</html>
